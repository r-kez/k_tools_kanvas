site_name: Kanvas Documentation
site_description: Documentation for Kanvas, a freeform reference board for Blender's Node Editor
site_url: https://r-kez.github.io/k_tools_kanvas/
repo_url: https://github.com/r-kez/k_tools_kanvas
repo_name: r-kez/k_tools_kanvas
docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start here:
      - Getting started: getting-started.md
      - Interface and navigation: interface.md
  - Working with content:
      - Images: images.md
      - Selecting and transforming: transforms.md
      - Arranging items: arranging.md
      - Frames: frames.md
      - Groups: groups.md
      - Text cards and checklists: text-cards.md
      - Comparing two images: comparison.md
      - Arrows: arrows.md
      - Shapes: shapes.md
      - Exporting a picture: export-image.md
      - References in the 3D View: references-3d.md
  - Marking up images:
      - Image masks: masks.md
      - Color Markup: color-markup.md
      - Straightening perspective: perspective.md
      - Measuring and real scale: measure.md
      - Auto Select: auto-select.md
  - Customizing and reference:
      - Preferences: preferences.md
      - Keyboard and mouse reference: shortcuts.md
      - Performance and memory: performance.md
      - Troubleshooting: troubleshooting.md
